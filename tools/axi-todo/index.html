<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axi Todo</title>
    <link rel="icon" type="image/png" href="./axi-todo-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      function showBootError(error) {
        const root = document.getElementById("root");
        if (!root) return;
        const message = error && (error.stack || error.message) ? (error.stack || error.message) : String(error || "Unknown error");
        root.innerHTML = "<pre style=\"box-sizing:border-box;margin:0;min-height:100vh;padding:24px;white-space:pre-wrap;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#991b1b;background:#fff7f7\">Axi Todo UI failed to start\n\n" + message.replace(/[&<>]/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[char];
        }) + "</pre>";
      }
      window.addEventListener("error", function (event) {
        showBootError(event.error || event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        showBootError(event.reason);
      });
    </script>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
