name: Bug Report
description: Report a defect, regression, or unexpected behavior.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, runtime version, branch / commit, relevant config.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact secrets) or attach screenshots.
  - type: checkboxes
    id: checks
    attributes:
      label: Self-check
      options:
        - label: I searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I can reproduce this bug on a clean checkout / fresh environment
        - label: I redacted all secrets (API keys, tokens, passwords) from logs
          required: true