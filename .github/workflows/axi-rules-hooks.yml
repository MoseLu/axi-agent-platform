# axi-rules-hooks.yml
# Server-side gate for AR-GIT-005 / AR-GIT-006.
#
# The local commit-msg hook blocks missing Lore trailers
# on every axiom-owned commit. This workflow is the
# server-side safety net: any push that bypasses the local
# hook (e.g. via `git push --no-verify` or a hand-rolled
# commit pipeline) is rejected here with a clear actionable
# error.
#
# Path filter limits the trigger to changes that actually
# affect the gate. Pull requests that do not touch
# .githooks/, the governance scripts, or this file are
# ignored.
#
# Implementation note: the workflow uses `git clone` to
# fetch the governance repo into a sibling path instead of
# `actions/checkout@v4` with the `repository:` field,
# because GitHub's default GITHUB_TOKEN cannot read
# private repositories across the actions/checkout
# boundary even within the same org (a security policy
# introduced in 2023). A `git clone` against the public
# git endpoint with the x-access-token credential prefix
# succeeds because the runner's GITHUB_TOKEN has the
# workflow scope. The governance repo is then run from
# its own subdirectory with `pnpm install` and the
# workspace-git-hooks scripts.

name: axi-rules-hooks

on:
  push:
    branches:
      - dev
      - main
    paths:
      - '.githooks/**'
      - 'infra/axi-workspace-governance/scripts/git-hooks/**'
      - 'infra/axi-workspace-governance/scripts/workspace-git-hooks.mjs'
      - 'infra/axi-workspace-governance/scripts/workspace-git-hooks.test.mjs'
      - '.github/workflows/axi-rules-hooks.yml'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '.githooks/**'
      - 'infra/axi-workspace-governance/scripts/git-hooks/**'
      - 'infra/axi-workspace-governance/scripts/workspace-git-hooks.mjs'
      - 'infra/axi-workspace-governance/scripts/workspace-git-hooks.test.mjs'
      - '.github/workflows/axi-rules-hooks.yml'
  workflow_dispatch:

concurrency:
  group: axi-rules-hooks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    name: install + git-hooks:test + verify (self-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout owning repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone governance repo into sibling path
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p infra
          git clone \
            --depth 1 \
            --branch dev \
            https://x-access-token:${GITHUB_TOKEN}@github.com/axiomaticworld/axi-workspace-governance.git \
            infra/axi-workspace-governance

      - name: Install governance dependencies
        working-directory: infra/axi-workspace-governance
        run: pnpm install --frozen-lockfile=false

      - name: Run hook unit tests
        working-directory: infra/axi-workspace-governance
        run: pnpm git-hooks:test

      - name: Install hooks into the owning repository
        working-directory: infra/axi-workspace-governance
        env:
          AXI_HOOKS_SELF_ONLY: '1'
        run: pnpm workspace:git:hooks:install

      - name: Verify the owning repository (self-only)
        working-directory: infra/axi-workspace-governance
        env:
          AXI_HOOKS_SELF_ONLY: '1'
        run: pnpm workspace:git:hooks:verify
